<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="menu-pepo" aria-label="Navegación principal">
        <a href="index.html" class="logo-pepo">PEPO MUSIC SOUND</a>

        <div class="enlaces-pepo">
            <a href="index.html">Inicio</a>
            <a href="javascript.html">JavaScript</a>
            <a href="jquery.html">jQuery</a>
            <a href="json.html">JSON</a>
            <a href="hosting.html">Hosting</a>
            <a href="google-ia.html">IAs de Google</a>
            <a href="cuestionario.html">Quiz</a>
            <a href="contacto.html" class="activo" aria-current="page">Contáctenos</a>
        </div>
    </nav>

    <!-- FORMULARIO DE CONTACTO -->
    <main class="contenedor">
        <section class="formulario">
            <p class="marca">PEPO MUSIC SOUND</p>

            <h1>Contáctanos</h1>

            <p class="descripcion">
                ¿Tienes alguna consulta o sugerencia?
                Envíanos tu mensaje y nos pondremos en contacto contigo.
            </p>

            <form id="contactForm">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@gmail.com"
                        maxlength="254"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        placeholder="Escribe tu mensaje..."
                        maxlength="5000"
                        required
                    ></textarea>
                </div>

                <button type="submit" id="btnEnviar">
                    Enviar mensaje
                </button>
            </form>

            <p id="resultado" role="status" aria-live="polite"></p>

            <a class="volver" href="index.html">
                ← Volver al inicio
            </a>
        </section>
    </main>

    <script>
        const formulario = document.getElementById("contactForm");
        const resultado = document.getElementById("resultado");
        const boton = document.getElementById("btnEnviar");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const correo = document.getElementById("correo").value.trim();
            const mensaje = document.getElementById("mensaje").value.trim();

            if (!nombre || !correo || !mensaje) {
                resultado.textContent = "Completa todos los campos.";
                resultado.style.color = "#c62828";
                return;
            }

            resultado.textContent = "Enviando tu mensaje...";
            resultado.style.color = "#7251b5";
            boton.disabled = true;
            boton.textContent = "Enviando...";

            try {
                const respuesta = await fetch("/api/contacto", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        correo: correo,
                        mensaje: mensaje
                    })
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(
                        datos.error || "No se pudo enviar el mensaje."
                    );
                }

                if (datos.parcial) {
                    resultado.textContent =
                        datos.mensaje ||
                        "El mensaje solo llegó a uno de los destinos.";
                    resultado.style.color = "#a66b00";
                } else {
                    resultado.textContent =
                        "¡Mensaje enviado correctamente a Discord y al correo!";
                    resultado.style.color = "#218838";
                }

                formulario.reset();

            } catch (error) {
                console.error("Error al enviar el formulario:", error);

                resultado.textContent =
                    error.message ||
                    "No se pudo conectar con el servidor. Inténtalo nuevamente.";

                resultado.style.color = "#c62828";

            } finally {
                boton.disabled = false;
                boton.textContent = "Enviar mensaje";
            }
        });
    </script>

</body>
</html>
