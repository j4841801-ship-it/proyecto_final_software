<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de Contacto</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .formulario {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4752C4;
        }

        #resultado {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="formulario">

        <h1>Contáctanos</h1>

        <form id="contactForm">

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input 
                    type="text" 
                    id="nombre" 
                    placeholder="Escribe tu nombre"
                    required
                >
            </div>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input 
                    type="email" 
                    id="correo" 
                    placeholder="ejemplo@gmail.com"
                    required
                >
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea 
                    id="mensaje" 
                    placeholder="Escribe tu mensaje..."
                    required
                ></textarea>
            </div>

            <button type="submit">
                Enviar mensaje
            </button>

        </form>

        <p id="resultado"></p>

    </div>


    <script>

        // ==================================================
        // PEGA AQUÍ TU NUEVO WEBHOOK DE DISCORD
        // ==================================================

        const webhookURL = "https://discord.com/api/webhooks/1557494789639905280/XpsUancje2leoQzsvrobPdPN1qfiCxJ12djdSDAU1mAFkdQqFXjQPqJRMSUcGCYFaebs";


        // ==================================================
        // FORMULARIO
        // ==================================================

        const formulario = document.getElementById("contactForm");

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();


            // Obtener los datos del formulario

            const nombre = document.getElementById("nombre").value;
            const correo = document.getElementById("correo").value;
            const mensaje = document.getElementById("mensaje").value;


            // Mensaje que recibirá Discord

            const datos = {

                content:
                "📩 **NUEVO MENSAJE DEL FORMULARIO**\n\n" +

                "👤 **Nombre:** " + nombre + "\n" +

                "📧 **Correo:** " + correo + "\n\n" +

                "💬 **Mensaje:**\n" + mensaje

            };


            try {

                const respuesta = await fetch(webhookURL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(datos)

                });


                if (respuesta.ok) {

                    document.getElementById("resultado").textContent =
                        "✅ Mensaje enviado correctamente.";

                    document.getElementById("resultado").style.color =
                        "green";

                    formulario.reset();

                } else {

                    document.getElementById("resultado").textContent =
                        "❌ No se pudo enviar el mensaje.";

                    document.getElementById("resultado").style.color =
                        "red";

                }


            } catch (error) {

                console.error(error);

                document.getElementById("resultado").textContent =
                    "❌ Ocurrió un error al enviar el mensaje.";

                document.getElementById("resultado").style.color =
                    "red";

            }

        });

    </script>

</body>
</html>
